# GitHub Pages へのデプロイ：テスト → BusyTeX の取得 → ビルド → 公開
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # BusyTeX の配布物（約 220 MB）はリポジトリに含めないので、固定したリリースから取得する。タグが変わらない限りキャッシュを使う
      - name: Cache BusyTeX
        uses: actions/cache@v4
        with:
          path: public/busytex
          key: busytex-${{ hashFiles('scripts/fetch-busytex.sh') }}
      - run: sh scripts/fetch-busytex.sh
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
